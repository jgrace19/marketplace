name: Agent E2E Exploration

on:
  pull_request:
    branches: [main]

jobs:
  agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Make sure origin/main is fetched for diff
        run: git fetch origin main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: scripts
        run: npm ci

      - name: Run agent orchestrator
        working-directory: scripts
        run: npm start
        env:
          CURSOR_API_KEY:    ${{ secrets.CURSOR_API_KEY }}
          LINEAR_API_KEY:    ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID:    ${{ secrets.LINEAR_TEAM_ID }}
          LINEAR_PROJECT_ID: ${{ secrets.LINEAR_PROJECT_ID }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:           ${{ github.repository }}
          GH_SHA:            ${{ github.event.pull_request.head.sha }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          BASE_REF:          origin/${{ github.event.pull_request.base.ref }}

      - name: Upload orchestrator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-orchestrator-output
          path: scripts/output/
          retention-days: 14
          if-no-files-found: ignore
