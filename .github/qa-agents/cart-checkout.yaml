id: cart-checkout
description: |
  Cart and Stripe Checkout flow. Should run if the diff touches Stripe checkout
  session creation, cart UI/state, payment verification, the post-redirect
  success/cancel flow, or shared product rendering used by the cart.
paths:
  - "backend/main.py"
  - "backend/requirements.txt"
  - "frontend/src/App.jsx"
  - "frontend/src/App.css"
  - "frontend/index.html"
  - "frontend/package.json"
  - ".env"
focus_prompt: |
  Probe the cart and Stripe Checkout flow for bugs. Cover:
  - Adding multiple distinct items to the cart and incrementing quantities.
  - Verifying the cart total matches `sum(price * quantity)` for the items shown.
  - Running a full Stripe test-mode checkout using card 4242 4242 4242 4242,
    any future date, and any 3-digit CVC. Compare the Stripe-side total to the
    in-app cart total exactly (e.g., 2 bananas at $3.49 must charge $6.98, not
    $3.49 or $6.97).
  - After redirect back to the app, the success notice MUST only show when the
    backend session-status endpoint reports `payment_status === "paid"`. If the
    notice appears under any other payment_status, file a bug.
  - Edge cases: rapid double-click on the Checkout button (should not create
    two Stripe sessions), decrementing a cart item from 1 (item should leave
    the cart cleanly), reloading mid-checkout, returning with `?checkout=cancel`,
    and clicking Checkout while the cart is empty (button must be disabled).
max_turns: 60
