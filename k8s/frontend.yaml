apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: marketplace
  labels:
    app: marketplace-frontend
    tags.datadoghq.com/env: local
    tags.datadoghq.com/service: marketplace-frontend
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketplace-frontend
  template:
    metadata:
      labels:
        app: marketplace-frontend
        tags.datadoghq.com/env: local
        tags.datadoghq.com/service: marketplace-frontend
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/frontend.logs: '[{"source":"nginx","service":"marketplace-frontend"}]'
    spec:
      containers:
        - name: frontend
          image: marketplace-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: marketplace
  labels:
    app: marketplace-frontend
spec:
  type: NodePort
  selector:
    app: marketplace-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
